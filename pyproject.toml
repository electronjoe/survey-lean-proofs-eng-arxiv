[project]
name = "survey-lean-proofs-eng-arxiv"
version = "0.1.0"
description = "Survey of recent engineering/systems arXiv papers for Lean and formal proof usage and authoring paradigms"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "matplotlib>=3.11.2",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["data", "dist", "papers", ".venv", ".git"]
